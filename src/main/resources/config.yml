# Thank you for downloading GlobalStats!

# Notify OPs on join if the plugin is due an update?
check-for-updates: true

# Choose the database type: true for SQLite, false for another database
useSQLite: true

# Configuration for another database (MySQL, PostgreSQL, etc.)
database:
  url: jdbc:mysql://localhost:3306/your_database_name
  username: your_username
  password: your_password
